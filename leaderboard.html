<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光明勇士｜全場排行榜</title><style>body{background:radial-gradient(#243b61,#09101f);color:#fff0cc;font-family:system-ui,"Microsoft JhengHei";text-align:center;margin:0;padding:25px}h1{font-size:clamp(30px,6vw,68px)}table{margin:auto;width:min(100%,900px);border-collapse:collapse;font-size:clamp(18px,3vw,34px)}td,th{padding:14px;border-bottom:1px solid #667795}th{color:#ffcb65}tr:nth-child(1) td{color:#ffe27c}#status{color:#a9d9e8}button{background:#eac073;border:0;padding:12px 22px;border-radius:10px;font-weight:bold;cursor:pointer}</style></head><body><h1>🏆 光明勇士 · 全場排行榜</h1><p id="status">正在連線…</p><table><thead><tr><th>名次</th><th>玩家</th><th>得分</th><th>秒數</th></tr></thead><tbody id="rows"></tbody></table><p>每 5 秒自動更新 · <button onclick="location.reload()">重新整理</button></p><script src="config.js"></script><script src="cloud.js"></script><script>function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function update(){try{let a=await LWCloud.top(20);document.getElementById('rows').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.player_name)}</td><td>${x.score}</td><td>${x.duration}</td></tr>`).join('')||'<tr><td colspan="4">尚無成績</td></tr>';document.getElementById('status').textContent='🟢 已連線 · 場次 '+LWCloud.eventId()}catch(e){document.getElementById('status').textContent='🔴 '+e.message}}update();setInterval(update,5000)</script></body></html>
