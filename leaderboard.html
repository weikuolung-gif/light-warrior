<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光明勇士｜排行榜</title><style>body{font-family:system-ui,'Microsoft JhengHei';background:#101c36;color:#fff;text-align:center;margin:0}main{max-width:760px;margin:auto;padding:16px}section{background:#203454;border:1px solid #617697;border-radius:16px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;margin:5px;border-radius:9px}input{background:#0b172c;color:white;border:1px solid #8797b3;max-width:90%}button{background:#ffcf73;border:0;font-weight:bold}h1,h2{color:#ffdc8c}a{color:#ffdc8c}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #526685;padding:9px}canvas{width:100%;max-width:550px;touch-action:manipulation}#msg{color:#ffd59a}</style><main><h1>🏆 光明勇士即時排行榜</h1><section><input id="code" maxlength="8" placeholder="場次代碼"><button id="go">顯示</button><h2 id="state">等待場次</h2><div id="ranks"></div></section></main><script>const $=x=>document.getElementById(x);async function call(action,body={}){const r=await fetch('https://edmoiwnmnigeqnrzxhon.supabase.co/functions/v1/match-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(a){return '<table><tr><th>名次</th><th>玩家</th><th>分數</th></tr>'+a.map(p=>'<tr><td>'+p.rank+'</td><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>').join('')+'</table>'}function target(code,slot){let h=2166136261;for(const c of code+':'+slot)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return {hole:h%9,type:h%100<70?'😈':h%100<85?'😇':'🙂'}}
$('code').value=new URLSearchParams(location.search).get('code')||'';$('go').onclick=()=>{history.replaceState(null,'','?code='+$('code').value.trim().toUpperCase());poll()};async function poll(){const code=$('code').value.trim().toUpperCase();if(!code)return;try{const r=await call('leaderboard',{code});$('state').textContent=r.status==='waiting'?'⏳ 等待開始':r.status==='finished'?'🏁 最終成績':'🔥 比賽進行中';$('ranks').innerHTML=rank(r.players)}catch(e){$('state').textContent=e.message}}setInterval(poll,2000);poll();</script></html>
