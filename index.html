<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光明勇士｜同步競賽</title><style>body{font-family:system-ui,'Microsoft JhengHei';background:#101c36;color:#fff;text-align:center;margin:0}main{max-width:760px;margin:auto;padding:16px}section{background:#203454;border:1px solid #617697;border-radius:16px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;margin:5px;border-radius:9px}input{background:#0b172c;color:white;border:1px solid #8797b3;max-width:90%}button{background:#ffcf73;border:0;font-weight:bold}h1,h2{color:#ffdc8c}a{color:#ffdc8c}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #526685;padding:9px}canvas{width:100%;max-width:550px;touch-action:manipulation}#msg{color:#ffd59a}</style><main><h1>⚔️ 光明勇士</h1><p>10 人同步競賽 · 60 秒 · 主辦方統一開始</p><section id="join"><h2>加入比賽</h2><input id="code" maxlength="8" placeholder="場次代碼"><br><input id="name" maxlength="12" placeholder="玩家姓名"><br><button id="joinBtn">加入等待室</button></section><section id="waiting" class="hide"><h2>⏳ 等待主辦方開始</h2><p id="count">等待其他玩家</p></section><section id="play" class="hide"><h2>得分 <span id="score">0</span>　剩餘 <span id="time">60</span> 秒</h2><p id="hint">😈 打魔鬼，不打天使與人物</p><canvas id="game" width="600" height="600"></canvas></section><p id="msg"></p><section><h2>🏆 即時排名</h2><div id="ranks">等待加入</div></section><a href="host.html">主辦方控制台</a> · <a href="leaderboard.html">投影排行榜</a></main><script>const $=x=>document.getElementById(x);async function call(action,body={}){const r=await fetch('https://edmoiwnmnigeqnrzxhon.supabase.co/functions/v1/match-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(a){return '<table><tr><th>名次</th><th>玩家</th><th>分數</th></tr>'+a.map(p=>'<tr><td>'+p.rank+'</td><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>').join('')+'</table>'}function target(code,slot){let h=2166136261;for(const c of code+':'+slot)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return {hole:h%9,type:h%100<70?'😈':h%100<85?'😇':'🙂'}}
let code='',token='',offset=0,start=0,playing=false,clicked=-1;const cv=$('game'),ctx=cv.getContext('2d');$('code').value=new URLSearchParams(location.search).get('code')||'';
$('joinBtn').onclick=async()=>{try{code=$('code').value.trim().toUpperCase();const r=await call('join',{code,name:$('name').value.trim()});token=r.token;offset=r.server_time-Date.now();$('join').classList.add('hide');$('waiting').classList.remove('hide');history.replaceState(null,'','?code='+code);poll()}catch(e){$('msg').textContent=e.message}};
async function poll(){if(!code)return;try{const r=await call('status',{code});offset=r.server_time-Date.now();$('ranks').innerHTML=rank(r.players);$('count').textContent='已加入 '+r.players.length+'/10 人';if(r.starts_at&&!playing&&r.status!=='finished'){start=Date.parse(r.starts_at);playing=true;$('waiting').classList.add('hide');$('play').classList.remove('hide');requestAnimationFrame(draw)}if(r.status==='finished'){$('msg').textContent='🏁 比賽結束';playing=false}}catch(e){$('msg').textContent=e.message}}setInterval(poll,2000);
function draw(){if(!playing)return;const ms=Date.now()+offset-start;ctx.fillStyle='#152440';ctx.fillRect(0,0,600,600);for(let i=0;i<9;i++){let x=100+i%3*200,y=100+Math.floor(i/3)*200;ctx.beginPath();ctx.arc(x,y,78,0,Math.PI*2);ctx.fillStyle='#34486b';ctx.fill()}$('time').textContent=Math.max(0,Math.ceil((60000-ms)/1000));if(ms<0){$('hint').textContent='全場倒數 '+Math.ceil(-ms/1000)}else if(ms<60000){const slot=Math.floor(ms/900),t=target(code,slot),x=100+t.hole%3*200,y=100+Math.floor(t.hole/3)*200;ctx.font='90px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.type,x,y);$('hint').textContent='😈 +10　😇 -15　🙂 -10'}else{playing=false;$('hint').textContent='🏁 比賽結束';poll();return}requestAnimationFrame(draw)}
cv.addEventListener('pointerdown',async e=>{const ms=Date.now()+offset-start;if(!playing||ms<0||ms>=60000)return;const rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)*600/rect.width,y=(e.clientY-rect.top)*600/rect.height,col=Math.floor(x/200),row=Math.floor(y/200),slot=Math.floor(ms/900);if(col<0||col>2||row<0||row>2||clicked===slot)return;const hole=row*3+col;if(target(code,slot).hole!==hole)return;clicked=slot;try{const r=await call('hit',{code,token,slot,hole});$('score').textContent=r.score}catch(e){$('msg').textContent=e.message}});</script></html>
