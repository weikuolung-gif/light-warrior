<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光明勇士｜主辦方</title><style>body{font-family:system-ui,'Microsoft JhengHei';background:#101c36;color:#fff;text-align:center;margin:0}main{max-width:760px;margin:auto;padding:16px}section{background:#203454;border:1px solid #617697;border-radius:16px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;margin:5px;border-radius:9px}input{background:#0b172c;color:white;border:1px solid #8797b3;max-width:90%}button{background:#ffcf73;border:0;font-weight:bold}h1,h2{color:#ffdc8c}a{color:#ffdc8c}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #526685;padding:9px}canvas{width:100%;max-width:550px;touch-action:manipulation}#msg{color:#ffd59a}</style><main><h1>🎛 光明勇士主辦方控制台</h1><section><input type="password" id="pin" placeholder="主辦方密碼"><button id="create">建立新場次</button><p id="msg"></p><div id="room" class="hide"><h2>場次 <span id="code"></span></h2><p><a id="joinlink" target="_blank">玩家加入網址</a></p><button id="start" disabled>全場統一開始（5 秒後）</button><p id="state"></p><div id="ranks"></div><p><a id="project" target="_blank">📺 投影排行榜</a></p></div></section></main><script>const $=x=>document.getElementById(x);async function call(action,body={}){const r=await fetch('https://edmoiwnmnigeqnrzxhon.supabase.co/functions/v1/match-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(a){return '<table><tr><th>名次</th><th>玩家</th><th>分數</th></tr>'+a.map(p=>'<tr><td>'+p.rank+'</td><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>').join('')+'</table>'}function target(code,slot){let h=2166136261;for(const c of code+':'+slot)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return {hole:h%9,type:h%100<70?'😈':h%100<85?'😇':'🙂'}}
let code='';$('create').onclick=async()=>{try{const r=await call('create',{pin:$('pin').value});code=r.code;$('room').classList.remove('hide');$('code').textContent=code;const u=new URL('index.html',location.href);u.searchParams.set('code',code);$('joinlink').href=u.href;$('joinlink').textContent=u.href;$('project').href='leaderboard.html?code='+code;$('msg').textContent='請把玩家網址分享給參賽者';poll()}catch(e){$('msg').textContent=e.message}};
$('start').onclick=async()=>{try{await call('start',{code,pin:$('pin').value});$('start').disabled=true;poll()}catch(e){$('msg').textContent=e.message}};
async function poll(){if(!code)return;try{const r=await call('status',{code});$('state').textContent='狀態：'+r.status+'　人數：'+r.players.length+'/10';$('start').disabled=r.status!=='waiting'||r.players.length===0;$('ranks').innerHTML=rank(r.players)}catch(e){$('msg').textContent=e.message}}setInterval(poll,2000);</script></html>
